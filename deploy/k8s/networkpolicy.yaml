apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cce-scheduler-netpol
  namespace: cce
  labels:
    app.kubernetes.io/name: cce-scheduler-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cce-scheduler-service
  policyTypes:
    - Egress
    - Ingress
  ingress:
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8083
          protocol: TCP
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Kafka
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 9092
          protocol: TCP
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
