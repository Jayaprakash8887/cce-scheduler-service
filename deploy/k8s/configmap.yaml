apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: cce
  labels:
    app.kubernetes.io/name: cce-scheduler-service
    app.kubernetes.io/version: "1.0.0"
data:
  SERVER_PORT: "8083"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.cce.svc.cluster.local:9092"
  KAFKA_TOPIC_SCHEDULER_TRIGGERS: "cce.scheduler.triggers"
  SCHEDULER_SCAN_INTERVAL: "5000"
  SCHEDULER_BATCH_SIZE: "100"
  SCHEDULER_LEASE_DURATION: "30"
  SCHEDULER_LEADER_RETRY: "5000"
  SCHEDULER_LOCK_KEY: "100001"
  SCHEDULER_WATERMARK_ENABLED: "true"
